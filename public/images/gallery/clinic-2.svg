<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" rx="24" fill="#F0FDFA"/>
  <rect x="40" y="40" width="720" height="520" rx="20" fill="#CCFBF1" opacity="0.5"/>
  <!-- Reception desk -->
  <rect x="200" y="300" width="400" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="220" y="310" width="360" height="20" rx="6" fill="#11B8C9" opacity="0.15"/>
  <!-- Logo on wall -->
  <circle cx="400" cy="200" r="40" fill="#11B8C9" opacity="0.1" stroke="#0D8F9E" stroke-width="2"/>
  <text x="400" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0D8F9E">S</text>
  <!-- Plants -->
  <rect x="160" y="340" width="20" height="60" rx="4" fill="#86EFAC" opacity="0.6"/>
  <circle cx="170" cy="325" r="18" fill="#4ADE80" opacity="0.4"/>
  <rect x="620" y="340" width="20" height="60" rx="4" fill="#86EFAC" opacity="0.6"/>
  <circle cx="630" cy="325" r="18" fill="#4ADE80" opacity="0.4"/>
  <!-- Floor tiles -->
  <line x1="120" y1="420" x2="680" y2="420" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="400" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#0D8F9E">Clinic Reception</text>
</svg>