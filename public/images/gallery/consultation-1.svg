<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" rx="24" fill="#F0FDFA"/>
  <rect x="40" y="40" width="720" height="520" rx="20" fill="#CCFBF1" opacity="0.5"/>
  <!-- Doctor figure -->
  <circle cx="340" cy="200" r="35" fill="#11B8C9" opacity="0.15" stroke="#0D8F9E" stroke-width="2"/>
  <rect x="310" y="245" width="60" height="80" rx="12" fill="#0D8F9E" opacity="0.15" stroke="#0D8F9E" stroke-width="1.5"/>
  <!-- Stethoscope -->
  <path d="M320 260c-10 20-10 40 0 55" stroke="#0D8F9E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Patient figure -->
  <circle cx="480" cy="210" r="30" fill="#11B8C9" opacity="0.1" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="455" y="250" width="50" height="70" rx="10" fill="#11B8C9" opacity="0.08" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Clipboard / consultation -->
  <rect x="370" y="280" width="50" height="65" rx="6" fill="white" stroke="#0D8F9E" stroke-width="2"/>
  <line x1="380" y1="298" x2="410" y2="298" stroke="#11B8C9" stroke-width="2" opacity="0.5"/>
  <line x1="380" y1="310" x2="405" y2="310" stroke="#11B8C9" stroke-width="2" opacity="0.4"/>
  <line x1="380" y1="322" x2="408" y2="322" stroke="#11B8C9" stroke-width="2" opacity="0.3"/>
  <!-- Speech bubble -->
  <path d="M420 180h100c8 0 14-6 14-14v-30c0-8-6-14-14-14H420c-8 0-14 6-14 14v30c0 8 6 14 14 14z" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M440 180l-10 15 20 0z" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="430" y1="148" x2="510" y2="148" stroke="#11B8C9" stroke-width="2" opacity="0.4"/>
  <line x1="430" y1="160" x2="490" y2="160" stroke="#11B8C9" stroke-width="2" opacity="0.3"/>
  <text x="400" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#0D8F9E">Patient Consultation</text>
</svg>