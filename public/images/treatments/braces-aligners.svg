<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" rx="24" fill="#F0FDFA"/>
  <rect x="40" y="40" width="720" height="520" rx="20" fill="#CCFBF1" opacity="0.5"/>
  <!-- Upper teeth row -->
  <path d="M300 220h200c8 0 14 6 14 14v30c0 8-6 14-14 14H300c-8 0-14-6-14-14v-30c0-8 6-14 14-14z" fill="white" stroke="#94A3B8" stroke-width="2"/>
  <!-- Lower teeth row -->
  <path d="M300 320h200c8 0 14 6 14 14v30c0 8-6 14-14 14H300c-8 0-14-6-14-14v-30c0-8 6-14 14-14z" fill="white" stroke="#94A3B8" stroke-width="2"/>
  <!-- Braces wire upper -->
  <path d="M290 248h220" stroke="#0D8F9E" stroke-width="3" stroke-linecap="round"/>
  <!-- Braces brackets upper -->
  <rect x="320" y="240" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <rect x="360" y="240" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <rect x="400" y="240" width="16" height="16" rx="2" fill="#11B8C9"/>
  <rect x="440" y="240" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <rect x="480" y="240" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <!-- Braces wire lower -->
  <path d="M290 348h220" stroke="#0D8F9E" stroke-width="3" stroke-linecap="round"/>
  <!-- Braces brackets lower -->
  <rect x="320" y="340" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <rect x="360" y="340" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <rect x="400" y="340" width="16" height="16" rx="2" fill="#11B8C9"/>
  <rect x="440" y="340" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <rect x="480" y="340" width="16" height="16" rx="2" fill="#0D8F9E"/>
  <!-- Aligner outline (dotted) -->
  <path d="M260 200c0-20 60-60 140-60s140 40 140 60" stroke="#11B8C9" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.5"/>
  <!-- Arrow showing alignment -->
  <path d="M540 290l20-5-5 20" stroke="#0D8F9E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M540 290l15 15" stroke="#0D8F9E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Label -->
  <text x="400" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#0D8F9E">Braces &amp; Aligners</text>
</svg>