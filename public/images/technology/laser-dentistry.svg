<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" rx="24" fill="#F0FDFA"/>
  <rect x="40" y="40" width="720" height="520" rx="20" fill="#CCFBF1" opacity="0.5"/>
  <!-- Laser device -->
  <rect x="350" y="120" width="100" height="60" rx="14" fill="#0D8F9E"/>
  <rect x="370" y="130" width="60" height="40" rx="8" fill="#11B8C9" opacity="0.3"/>
  <!-- Laser tip -->
  <rect x="393" y="180" width="14" height="50" rx="3" fill="#64748B"/>
  <!-- Laser beam -->
  <line x1="400" y1="230" x2="400" y2="380" stroke="#EF4444" stroke-width="3" opacity="0.8"/>
  <line x1="400" y1="230" x2="400" y2="380" stroke="#FCA5A5" stroke-width="8" opacity="0.15"/>
  <!-- Beam glow -->
  <circle cx="400" cy="380" r="20" fill="#EF4444" opacity="0.1"/>
  <circle cx="400" cy="380" r="10" fill="#EF4444" opacity="0.15"/>
  <!-- Tooth being treated -->
  <path d="M400 350c-22 0-38 12-45 30-5 14-3 30 5 42l12 24c3 6 5 14 5 22v40c0 10 10 20 23 20s23-10 23-20v-40c0-8 2-16 5-22l12-24c8-12 10-28 5-42-7-18-23-30-45-30z" fill="white" stroke="#94A3B8" stroke-width="2"/>
  <!-- Precision indicators -->
  <circle cx="300" cy="300" r="3" fill="#11B8C9" opacity="0.5"/>
  <circle cx="500" cy="300" r="3" fill="#11B8C9" opacity="0.5"/>
  <path d="M310 300h80" stroke="#11B8C9" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <path d="M410 300h80" stroke="#11B8C9" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <!-- Label -->
  <text x="400" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#0D8F9E">Laser Dentistry</text>
</svg>